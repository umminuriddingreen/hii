<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">A101 Concept Floor Plan and Wall Geometry</title>
  <desc id="desc">Architectural concept sheet for Channing Court showing lot, existing Eichler wall geometry, atrium, garden pavilion, wall legend, notes, and title block.</desc>
  <defs>
    <style>
      .sheet { fill: #f8f8f4; }
      .border { fill: none; stroke: #111; stroke-width: 3; }
      .thin { fill: none; stroke: #111; stroke-width: 1.4; }
      .wall { fill: #111; }
      .newwall { fill: #4f6f5d; }
      .glass { stroke: #2e7196; stroke-width: 3; fill: none; }
      .slab { fill: #efede4; stroke: #777; stroke-width: 1; }
      .deck { fill: #d9c99f; stroke: #777; stroke-width: 1; }
      .tree { fill: none; stroke: #5e755f; stroke-width: 2; }
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .h1 { font-size: 34px; font-weight: 700; }
      .h2 { font-size: 22px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .dim { stroke: #333; stroke-width: 1; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <rect class="sheet" width="1440" height="960"/>
  <rect class="border" x="28" y="28" width="1384" height="904"/>

  <text class="txt h1" x="58" y="75">CHANNING COURT - WALL GEOMETRY CONCEPT</text>
  <text class="txt body" x="58" y="100">1601 Channing Ave, Palo Alto, CA 94303 - concept only, not for construction</text>
  <text class="txt small" x="58" y="120">Scale: diagrammatic  |  North: up  |  Units: feet represented as CAD model units</text>

  <g transform="translate(150 110) scale(8)">
    <!-- lot -->
    <rect class="slab" x="-37.5" y="-47.5" width="75" height="95"/>
    <text class="txt tiny" x="-36" y="-49.5">75' x 95' LOT REFERENCE</text>

    <!-- main house slab -->
    <rect class="slab" x="-28" y="-33" width="56" height="34"/>
    <!-- exterior existing wall geometry -->
    <rect class="wall" x="-28" y="0.7" width="24" height="0.55"/>
    <rect class="wall" x="0" y="0.7" width="8" height="0.55"/>
    <rect class="wall" x="24" y="0.7" width="4" height="0.55"/>
    <rect class="wall" x="-28" y="-33.3" width="6" height="0.55"/>
    <rect class="wall" x="-10" y="-33.3" width="12" height="0.55"/>
    <rect class="wall" x="9" y="-33.3" width="4" height="0.55"/>
    <rect class="wall" x="25" y="-33.3" width="3" height="0.55"/>
    <rect class="wall" x="-28.3" y="-33" width="0.55" height="4"/>
    <rect class="wall" x="-28.3" y="-23" width="0.55" height="9"/>
    <rect class="wall" x="-28.3" y="-8" width="0.55" height="9"/>
    <rect class="wall" x="27.75" y="-33" width="0.55" height="15"/>
    <rect class="wall" x="27.75" y="-10" width="0.55" height="3"/>
    <!-- atrium ring -->
    <rect class="slab" x="-7" y="-22" width="14" height="12"/>
    <rect class="wall" x="-7.5" y="-10.3" width="1" height="0.38"/>
    <rect class="wall" x="6.5" y="-10.3" width="1" height="0.38"/>
    <rect class="wall" x="-7.5" y="-22.1" width="1" height="0.38"/>
    <rect class="wall" x="6.5" y="-22.1" width="1" height="0.38"/>
    <line class="glass" x1="-6.5" y1="-10" x2="6.5" y2="-10"/>
    <line class="glass" x1="-6.5" y1="-22" x2="6.5" y2="-22"/>
    <line class="glass" x1="-7.5" y1="-22" x2="-7.5" y2="-10"/>
    <line class="glass" x1="7.5" y1="-22" x2="7.5" y2="-10"/>

    <!-- interior partitions -->
    <rect class="wall" x="-9.65" y="-33" width="0.38" height="11"/>
    <rect class="wall" x="-28" y="-27.2" width="18.5" height="0.38"/>
    <rect class="wall" x="-28" y="-22.2" width="18.5" height="0.38"/>
    <rect class="wall" x="9.3" y="-33" width="0.38" height="11"/>
    <rect class="wall" x="9.5" y="-27.7" width="18.5" height="0.38"/>
    <rect class="wall" x="9.5" y="-12.2" width="18.5" height="0.38"/>

    <!-- program blocks -->
    <rect class="deck" x="14.25" y="-17.6" width="7.5" height="3.2"/>
    <text class="txt tiny" x="14" y="-18.6">KITCHEN</text>
    <rect class="deck" x="-25.5" y="-7.1" width="13" height="2.2"/>
    <text class="txt tiny" x="-26" y="-8.4">STORAGE / WORK WALL</text>

    <!-- pavilion -->
    <rect class="slab" x="4" y="17" width="28" height="22"/>
    <rect class="newwall" x="4" y="16.7" width="4" height="0.55"/>
    <rect class="newwall" x="28" y="16.7" width="4" height="0.55"/>
    <line class="glass" x1="8" y1="17" x2="28" y2="17"/>
    <rect class="newwall" x="4" y="38.75" width="9" height="0.55"/>
    <rect class="newwall" x="23" y="38.75" width="9" height="0.55"/>
    <line class="glass" x1="13" y1="39" x2="23" y2="39"/>
    <rect class="newwall" x="3.75" y="17" width="0.55" height="22"/>
    <rect class="newwall" x="31.75" y="17" width="0.55" height="22"/>
    <rect class="newwall" x="11.8" y="29" width="0.38" height="10"/>
    <rect class="newwall" x="22" y="32.3" width="10" height="0.38"/>
    <text class="txt tiny" x="7" y="26">ADU-READY GARDEN ROOM</text>

    <!-- deck / trellis / QR -->
    <rect class="deck" x="-2" y="-7.5" width="20" height="31"/>
    <text class="txt tiny" x="0" y="7">COVERED COMMONS</text>
    <rect class="wall" x="22.8" y="-44.1" width="4.5" height="0.4"/>
    <text class="txt tiny" x="20" y="-45.2">QR SIGN</text>

    <!-- trees -->
    <circle class="tree" cx="-25" cy="-39" r="4.5"/>
    <circle class="tree" cx="-29" cy="34" r="5.2"/>
    <circle class="tree" cx="35" cy="9" r="4"/>

    <!-- labels -->
    <text class="txt tiny" x="-25" y="-16">BEDROOM WING</text>
    <text class="txt tiny" x="12" y="-23">LIVING / KITCHEN</text>
    <text class="txt tiny" x="-5" y="-15.5">OPEN ATRIUM</text>

    <!-- dimensions -->
    <line class="dim" x1="-37.5" y1="51" x2="37.5" y2="51"/>
    <text class="txt tiny" x="-4" y="54">75'-0"</text>
    <line class="dim" x1="42" y1="-47.5" x2="42" y2="47.5"/>
    <text class="txt tiny" x="43" y="2">95'-0"</text>
  </g>

  <g transform="translate(950 160)">
    <text class="txt h2" x="0" y="0">GENERAL NOTES</text>
    <text class="txt body" x="0" y="32">1. Concept wall geometry only. Verify all dimensions by survey.</text>
    <text class="txt body" x="0" y="58">2. Existing Eichler footprint and walls are diagrammatic.</text>
    <text class="txt body" x="0" y="84">3. Preserve single-story street character and atrium daylight.</text>
    <text class="txt body" x="0" y="110">4. New rear pavilion is ADU-ready, subject to zoning review.</text>
    <text class="txt body" x="0" y="136">5. Tree locations are placeholders pending arborist review.</text>

    <text class="txt h2" x="0" y="196">LEGEND</text>
    <rect class="wall" x="0" y="220" width="44" height="16"/>
    <text class="txt body" x="60" y="233">Existing / retained wall geometry</text>
    <rect class="newwall" x="0" y="252" width="44" height="16"/>
    <text class="txt body" x="60" y="265">New garden pavilion walls</text>
    <line class="glass" x1="0" y1="296" x2="44" y2="296"/>
    <text class="txt body" x="60" y="301">Glazing / sliding door openings</text>
    <rect class="deck" x="0" y="322" width="44" height="16"/>
    <text class="txt body" x="60" y="335">Deck, casework, or service element</text>

    <text class="txt h2" x="0" y="400">SHEET INDEX</text>
    <text class="txt body" x="0" y="432">A000 Concept Board</text>
    <text class="txt body" x="0" y="458">A101 Wall Geometry Plan</text>
    <text class="txt body" x="0" y="484">M001 STEP / GLB / STL CAD Model</text>
  </g>

  <g transform="translate(950 710)">
    <rect class="thin" x="0" y="0" width="392" height="160"/>
    <line class="thin" x1="0" y1="52" x2="392" y2="52"/>
    <line class="thin" x1="0" y1="104" x2="392" y2="104"/>
    <line class="thin" x1="230" y1="0" x2="230" y2="160"/>
    <text class="txt h2" x="16" y="34">HII / CHANNING COURT</text>
    <text class="txt body" x="16" y="84">1601 Channing Ave, Palo Alto</text>
    <text class="txt body" x="16" y="136">CONCEPT WALL GEOMETRY - NOT FOR CONSTRUCTION</text>
    <text class="txt h1" x="260" y="98">A101</text>
    <text class="txt small" x="246" y="132">2026-08-11</text>
  </g>
</svg>
