<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HII Three.js smoke fixture</title>
    <style>html,body,canvas{width:100%;height:100%;margin:0;display:block;background:#10131a}</style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.append(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10);
      camera.position.z = 2;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshNormalMaterial()
      );
      scene.add(mesh);
      renderer.render(scene, camera);
    </script>
  </body>
</html>
