[package]
name = "hii-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Shared local state and contracts for the HII CLI and desktop"

[dependencies]
blake3 = "1.5"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
dirs = "5.0.1"
fs2 = "0.4.3"
regex = "1.11.1"
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.22.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.13"
ureq = "2.12.1"
url = "2.5.8"
uuid = { version = "1.11.0", features = ["v4", "v7"] }
walkdir = "2.5"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
