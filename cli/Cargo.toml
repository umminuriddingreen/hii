[package]
name = "hii-cli"
version = "0.1.0"
edition = "2021"
description = "Fast, local-first workspace agent for HII"
license-file = "../LICENSE"

[[bin]]
name = "hii"
path = "src/main.rs"

[features]
default = []
preview = []

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = "4.5.58"
crossterm = "0.28.1"
ctrlc = "3.4.5"
dirs = "5.0.1"
fs2 = "0.4.3"
ignore = "0.4.23"
hii-core = { path = "../crates/hii-core" }
hii-fabric-protocol = { path = "../fabric/protocol" }
libc = "0.2.177"
plist = "1.8.0"
rand = "0.8.5"
rcgen = "0.13.2"
regex = "1.11.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
time = "0.3.44"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
ureq = { version = "2.12.1", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.11.0", features = ["v4"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }

[dev-dependencies]
tempfile = "3.24.0"
