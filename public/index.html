<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hii Vault Viewer</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>hii Vault Viewer</h1>
      <div>
        <button id="reload">Reload</button>
        <span id="status"></span>
      </div>
    </header>
    <main id="desktop">
      <section class="panel panel-notes" data-panel="notes">
        <div class="panel-header">
          <div>
            <span class="panel-eyebrow">Vault</span>
            <h3>Notes</h3>
          </div>
          <span class="panel-grip" aria-hidden="true">:::</span>
        </div>
        <div class="panel-body">
          <input id="filter" placeholder="Filter notes..." />
          <div class="counts">Showing link and backlink counts</div>
          <div class="search-box">
            <input id="search" placeholder="Search body text..." />
            <button id="searchBtn">Search</button>
          </div>
          <ul id="notes"></ul>
        </div>
      </section>
      <section class="panel panel-graph" data-panel="graph">
        <div class="panel-header">
          <div>
            <span class="panel-eyebrow">Map</span>
            <h3>Graph</h3>
          </div>
          <span class="panel-grip" aria-hidden="true">:::</span>
        </div>
        <div class="panel-body panel-body-canvas">
          <canvas id="graph" width="800" height="600"></canvas>
        </div>
      </section>
      <section class="panel panel-info" data-panel="info">
        <div class="panel-header">
          <div>
            <span class="panel-eyebrow">Context</span>
            <h3>Inspector</h3>
          </div>
          <span class="panel-grip" aria-hidden="true">:::</span>
        </div>
        <div class="panel-body">
          <div id="info"></div>
        </div>
      </section>
    </main>
    <script src="/static/viewer.js"></script>
  </body>
</html>
