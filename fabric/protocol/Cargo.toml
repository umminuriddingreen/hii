[package]
name = "hii-fabric-protocol"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSES/Apache-2.0.txt"
description = "Versioned control protocol and bounded framing for the HII machine fabric"
publish = false

[dependencies]
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
thiserror = "2.0"

# Keep this bounded substrate independently testable until the parent runtime
# deliberately integrates it into the root workspace.
[workspace]
