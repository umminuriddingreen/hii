<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hii visual</title>
<style>
  :root {
    --bg: #191919;
    --surface: #202020;
    --panel: #191919;
    --border: rgba(255,255,255,0.05);
    --border-strong: rgba(255,255,255,0.10);
    --text: #ffffffd9;
    --dim: #ffffff73;
    --accent: #4ecdc4;
    --accent-soft: rgba(78,205,196,0.12);
    --purple: #9775fa;
    --blue: #60a5fa;
    --orange: #ffa94d;
    --warn: #ff6b6b;
    --ok: #51cf66;
    --cyan: #67e8f9;
    --canvas-shadow: 0 2px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  /* Epilepsy safe */
  * { animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; height: 48px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 200;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-left .brand { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
  .topbar-left .sep { width: 1px; height: 20px; background: var(--border); }
  .topbar-left .filename { font-size: 13px; color: var(--dim); }

  .topbar-center { display: flex; align-items: center; gap: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .tb-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-family: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .tb-btn.active { background: var(--accent-soft); color: var(--accent); }
  .tb-btn.primary { background: var(--accent); color: #111; font-weight: 600; }
  .tb-btn.primary:hover { opacity: 0.9; }
  .tb-btn.ghost { border: 1px solid var(--border); }
  .tb-btn.ghost:hover { border-color: var(--border-strong); }

  .nav-pill { padding: 6px 10px; border-radius: 4px; font-size: 14px; text-decoration: none; color: var(--dim); }
  .nav-pill:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-pill.active { color: var(--text); background: rgba(255,255,255,0.06); font-weight: 500; }

  /* ── Layout ── */
  .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

  /* ── Canvas Viewport ── */
  .viewport {
    flex: 1; position: relative; overflow: hidden;
    background: #1a1a1a;
    /* subtle dot grid */
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #canvas {
    position: absolute; top: 0; left: 0;
    cursor: crosshair;
    box-shadow: var(--canvas-shadow);
    border-radius: 2px;
  }

  /* ── Floating Bottom Toolbar (Figma-style) ── */
  .float-toolbar {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 4px 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 150;
  }
  .ft-btn {
    width: 40px; height: 36px; background: none; border: none;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; color: var(--dim); font-size: 18px;
    position: relative;
  }
  .ft-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .ft-btn.active { background: var(--accent-soft); color: var(--accent); }
  .ft-btn .ft-label {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); background: #111; color: #ddd; font-size: 11px;
    padding: 4px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none;
  }
  .ft-btn:hover .ft-label { display: block; }
  .ft-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* ── Right Panel ── */
  .panel-right {
    width: 260px; background: var(--panel); border-left: 1px solid var(--border);
    flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .panel-section {
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  .panel-section:last-child { border-bottom: none; }
  .panel-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--dim); margin-bottom: 12px;
  }
  .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .prop-row:last-child { margin-bottom: 0; }
  .prop-label { font-size: 12px; color: var(--dim); min-width: 52px; }
  .prop-row input[type="range"] { flex: 1; accent-color: var(--accent); height: 3px; }
  .prop-row input[type="number"] {
    width: 48px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 4px;
    font-family: inherit; font-size: 12px; text-align: center;
  }
  .prop-row input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .prop-row input[type="color"] {
    width: 32px; height: 28px; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer; padding: 0;
  }

  /* Color swatches */
  .color-swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch:hover { border-color: rgba(255,255,255,0.25); }
  .swatch.active { border-color: var(--accent); }

  /* Layers */
  .layer-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; font-size: 12px;
    cursor: pointer; border: 1px solid transparent;
  }
  .layer-item:hover { background: rgba(255,255,255,0.03); }
  .layer-item.active { border-color: var(--accent); background: var(--accent-soft); }
  .layer-vis {
    width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; cursor: pointer; color: transparent;
  }
  .layer-vis.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .panel-btn {
    background: none; border: 1px solid var(--border); color: var(--dim);
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 500;
  }
  .panel-btn:hover { border-color: var(--border-strong); color: var(--text); }

  /* ── AI Prompt Panel ── */
  .ai-prompt-row { display: flex; gap: 6px; }
  .ai-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px;
    font-family: inherit; font-size: 13px; resize: none; height: 36px;
  }
  .ai-input:focus { outline: none; border-color: var(--purple); }
  .ai-input::placeholder { color: var(--dim); }
  .ai-send {
    background: var(--purple); color: #fff; border: none; border-radius: 8px;
    padding: 0 14px; cursor: pointer; font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .ai-send:hover { opacity: 0.9; }
  .ai-hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

  /* ── Status Bar ── */
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; height: 28px;
    background: var(--panel); border-top: 1px solid var(--border);
    font-size: 11px; color: var(--dim); flex-shrink: 0;
  }
  .statusbar .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .zoom-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 14px; padding: 0 4px; line-height: 1;
  }
  .zoom-btn:hover { color: var(--text); }
  .zoom-display { font-size: 11px; color: var(--dim); min-width: 36px; text-align: center; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="brand">hii</span>
    <span class="sep"></span>
    <a class="nav-pill" href="/">&#9632; Dashboard</a>
    <a class="nav-pill" href="/graph">&#9679; Graph</a>
    <a class="nav-pill active" href="/visual">&#9670; Visual</a>
    <span class="sep"></span>
    <span class="filename">Untitled Canvas</span>
  </div>
  <div class="topbar-right">
    <button class="tb-btn ghost" onclick="clearCanvas()">Clear</button>
    <button class="tb-btn ghost" onclick="exportCanvas()">Export PNG</button>
    <button class="tb-btn primary" onclick="saveToHII()">Save to HII</button>
  </div>
</div>

<div class="workspace">
  <!-- Canvas Viewport -->
  <div class="viewport" id="canvas-area">
    <canvas id="canvas"></canvas>

    <!-- Floating Toolbar -->
    <div class="float-toolbar">
      <button class="ft-btn active" data-tool="brush"><span class="ft-label">Brush (B)</span>&#9679;</button>
      <button class="ft-btn" data-tool="pencil"><span class="ft-label">Pencil (P)</span>&#9998;</button>
      <button class="ft-btn" data-tool="eraser"><span class="ft-label">Eraser (E)</span>&#9634;</button>
      <div class="ft-sep"></div>
      <button class="ft-btn" data-tool="line"><span class="ft-label">Line (L)</span>&#9585;</button>
      <button class="ft-btn" data-tool="rect"><span class="ft-label">Rectangle (R)</span>&#9633;</button>
      <button class="ft-btn" data-tool="circle"><span class="ft-label">Circle (C)</span>&#9675;</button>
      <button class="ft-btn" data-tool="fill"><span class="ft-label">Fill (F)</span>&#9687;</button>
      <div class="ft-sep"></div>
      <button class="ft-btn" data-tool="text"><span class="ft-label">Text (T)</span>A</button>
      <button class="ft-btn" data-tool="eyedropper"><span class="ft-label">Eyedropper (I)</span>&#9738;</button>
      <button class="ft-btn" data-tool="move"><span class="ft-label">Pan (Space)</span>&#9995;</button>
      <div class="ft-sep"></div>
      <button class="ft-btn" onclick="undo()"><span class="ft-label">Undo (Cmd+Z)</span>&#8617;</button>
      <button class="ft-btn" onclick="redo()"><span class="ft-label">Redo (Cmd+Shift+Z)</span>&#8618;</button>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="panel-right">
    <!-- Brush -->
    <div class="panel-section">
      <div class="panel-title">Brush</div>
      <div class="prop-row">
        <span class="prop-label">Size</span>
        <input type="range" id="brush-size" min="1" max="100" value="4">
        <input type="number" id="brush-size-num" min="1" max="100" value="4">
      </div>
      <div class="prop-row">
        <span class="prop-label">Opacity</span>
        <input type="range" id="brush-opacity" min="1" max="100" value="100">
        <input type="number" id="brush-opacity-num" min="1" max="100" value="100">
      </div>
      <div class="prop-row">
        <span class="prop-label">Hardness</span>
        <input type="range" id="brush-hardness" min="0" max="100" value="80">
      </div>
    </div>

    <!-- Color -->
    <div class="panel-section">
      <div class="panel-title">Color</div>
      <div class="prop-row" style="margin-bottom:10px">
        <input type="color" id="color-picker" value="#333333">
        <span id="color-hex" style="font-size:12px;color:var(--dim);font-family:'SF Mono',monospace">#333333</span>
      </div>
      <div class="color-swatches" id="swatches"></div>
    </div>

    <!-- Canvas -->
    <div class="panel-section">
      <div class="panel-title">Canvas</div>
      <div class="prop-row">
        <span class="prop-label">W</span>
        <input type="number" id="canvas-w" value="1920" min="1" max="8192">
        <span class="prop-label" style="min-width:20px;text-align:center">H</span>
        <input type="number" id="canvas-h" value="1080" min="1" max="8192">
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="panel-btn" onclick="resizeCanvas()">Resize</button>
        <button class="panel-btn" onclick="fillBackground()">Fill BG</button>
      </div>
    </div>

    <!-- Layers -->
    <div class="panel-section">
      <div class="panel-title">Layers</div>
      <div id="layers-list"></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="panel-btn" onclick="addLayer()">Add Layer</button>
        <button class="panel-btn" onclick="removeLayer()">Remove</button>
        <button class="panel-btn" onclick="mergeDown()">Merge</button>
      </div>
    </div>

    <!-- AI Generate -->
    <div class="panel-section" style="margin-top:auto">
      <div class="panel-title">AI Generate</div>
      <div class="ai-prompt-row">
        <input class="ai-input" id="ai-prompt" placeholder="Describe what to create...">
        <button class="ai-send" onclick="aiGenerate()">Go</button>
      </div>
      <div class="ai-hint">Powered by HII intent engine</div>
    </div>
  </div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <span id="status-pos">0, 0</span>
  <span id="status-tool">brush</span>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomOut()">&#8722;</button>
    <span class="zoom-display" id="zoom-display">100%</span>
    <button class="zoom-btn" onclick="zoomIn()">+</button>
    <button class="zoom-btn" onclick="centerCanvas()" title="Fit to view">&#9635;</button>
  </div>
  <span id="status-size">1920 x 1080</span>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const SWATCHES = [
  '#000000','#333333','#555555','#888888','#bbbbbb','#ffffff',
  '#ff6b6b','#ffa94d','#facc15','#51cf66','#4ecdc4','#60a5fa',
  '#9775fa','#f472b6','#a3e635','#67e8f9','#fb7185','#c084fc',
];

let currentTool = 'brush';
let brushSize = 4;
let brushOpacity = 1.0;
let brushHardness = 0.8;
let currentColor = '#333333';
let canvasW = 1920;
let canvasH = 1080;

let layers = [];
let activeLayerIdx = 0;
let undoStack = [];
let redoStack = [];
const MAX_UNDO = 40;

let drawing = false;
let lastX = 0, lastY = 0;
let shapeStartX = 0, shapeStartY = 0;

let panX = 0, panY = 0, zoom = 1;
let panning = false, panStartX = 0, panStartY = 0;

const mainCanvas = document.getElementById('canvas');
const mainCtx = mainCanvas.getContext('2d');
const canvasArea = document.getElementById('canvas-area');

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  mainCanvas.width = canvasW;
  mainCanvas.height = canvasH;
  addLayer();
  fillBackground('#ffffff', { skipUndo: true });  // WHITE canvas
  addLayer();
  renderSwatches();
  syncSliders();
  updateCanvasTransform();
  compositeAll();
  centerCanvas();
  updateZoomDisplay();
}

function createLayerCanvas() {
  const c = document.createElement('canvas');
  c.width = canvasW; c.height = canvasH;
  return c;
}

function addLayer() {
  const c = createLayerCanvas();
  layers.push({ canvas: c, visible: true, name: 'Layer ' + (layers.length + 1) });
  activeLayerIdx = layers.length - 1;
  renderLayers();
}

function removeLayer() {
  if (layers.length <= 1) return;
  layers.splice(activeLayerIdx, 1);
  activeLayerIdx = Math.min(activeLayerIdx, layers.length - 1);
  compositeAll(); renderLayers();
}

function mergeDown() {
  if (activeLayerIdx === 0 || layers.length < 2) return;
  const upper = layers[activeLayerIdx];
  const lower = layers[activeLayerIdx - 1];
  lower.canvas.getContext('2d').drawImage(upper.canvas, 0, 0);
  layers.splice(activeLayerIdx, 1);
  activeLayerIdx--;
  compositeAll(); renderLayers();
}

function renderLayers() {
  const el = document.getElementById('layers-list');
  el.innerHTML = layers.map((l, i) => `
    <div class="layer-item ${i === activeLayerIdx ? 'active' : ''}" onclick="activeLayerIdx=${i};renderLayers()">
      <div class="layer-vis ${l.visible ? 'on' : ''}" onclick="event.stopPropagation();layers[${i}].visible=!layers[${i}].visible;compositeAll();renderLayers()">${l.visible ? '&#10003;' : ''}</div>
      <span>${l.name}</span>
    </div>
  `).reverse().join('');
}

// ── Composite ────────────────────────────────────────────────────────────────
function compositeAll() {
  mainCtx.clearRect(0, 0, canvasW, canvasH);
  for (const l of layers) {
    if (!l.visible) continue;
    mainCtx.drawImage(l.canvas, 0, 0);
  }
}

// ── Undo/Redo ────────────────────────────────────────────────────────────────
function saveUndo() {
  const snapshot = layers.map(l => {
    const c = createLayerCanvas();
    c.getContext('2d').drawImage(l.canvas, 0, 0);
    return { canvas: c, visible: l.visible, name: l.name };
  });
  undoStack.push({ layers: snapshot, activeIdx: activeLayerIdx });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (!undoStack.length) return;
  const snap = undoStack.pop();
  const current = layers.map(l => {
    const c = createLayerCanvas();
    c.getContext('2d').drawImage(l.canvas, 0, 0);
    return { canvas: c, visible: l.visible, name: l.name };
  });
  redoStack.push({ layers: current, activeIdx: activeLayerIdx });
  layers = snap.layers;
  activeLayerIdx = snap.activeIdx;
  compositeAll(); renderLayers();
}

function redo() {
  if (!redoStack.length) return;
  const snap = redoStack.pop();
  const current = layers.map(l => {
    const c = createLayerCanvas();
    c.getContext('2d').drawImage(l.canvas, 0, 0);
    return { canvas: c, visible: l.visible, name: l.name };
  });
  undoStack.push({ layers: current, activeIdx: activeLayerIdx });
  layers = snap.layers;
  activeLayerIdx = snap.activeIdx;
  compositeAll(); renderLayers();
}

// ── Drawing ──────────────────────────────────────────────────────────────────
function getActiveCtx() { return layers[activeLayerIdx].canvas.getContext('2d'); }

function canvasCoords(e) {
  const rect = mainCanvas.getBoundingClientRect();
  return [(e.clientX - rect.left) / zoom, (e.clientY - rect.top) / zoom];
}

function drawBrushStroke(ctx, x0, y0, x1, y1) {
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const steps = Math.max(1, Math.floor(dist / (brushSize * 0.2)));
  ctx.globalAlpha = brushOpacity;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = x0 + (x1 - x0) * t;
    const y = y0 + (y1 - y0) * t;
    if (currentTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (brushHardness >= 0.9) {
      ctx.fillStyle = currentColor;
      ctx.beginPath(); ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      const grad = ctx.createRadialGradient(x, y, 0, x, y, brushSize / 2);
      grad.addColorStop(0, currentColor);
      grad.addColorStop(brushHardness, currentColor);
      grad.addColorStop(1, currentColor.slice(0, 7) + '00');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawPencilStroke(ctx, x0, y0, x1, y1) {
  ctx.globalAlpha = brushOpacity; ctx.strokeStyle = currentColor; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(Math.floor(x0) + 0.5, Math.floor(y0) + 0.5);
  ctx.lineTo(Math.floor(x1) + 0.5, Math.floor(y1) + 0.5);
  ctx.stroke(); ctx.globalAlpha = 1;
}

function floodFill(ctx, startX, startY, fillColor) {
  const imgData = ctx.getImageData(0, 0, canvasW, canvasH);
  const data = imgData.data;
  const sx = Math.floor(startX), sy = Math.floor(startY);
  if (sx < 0 || sy < 0 || sx >= canvasW || sy >= canvasH) return;
  const idx = (sy * canvasW + sx) * 4;
  const tR = data[idx], tG = data[idx+1], tB = data[idx+2], tA = data[idx+3];
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.fillStyle = fillColor; tmp.fillRect(0,0,1,1);
  const fc = tmp.getImageData(0,0,1,1).data;
  if (tR === fc[0] && tG === fc[1] && tB === fc[2] && tA === fc[3]) return;
  const stack = [[sx, sy]];
  const visited = new Uint8Array(canvasW * canvasH);
  while (stack.length) {
    const [x, y] = stack.pop();
    const i = y * canvasW + x;
    if (x < 0 || y < 0 || x >= canvasW || y >= canvasH || visited[i]) continue;
    const pi = i * 4;
    if (Math.abs(data[pi]-tR)>32 || Math.abs(data[pi+1]-tG)>32 || Math.abs(data[pi+2]-tB)>32 || Math.abs(data[pi+3]-tA)>32) continue;
    visited[i] = 1;
    data[pi]=fc[0]; data[pi+1]=fc[1]; data[pi+2]=fc[2]; data[pi+3]=255;
    stack.push([x-1,y],[x+1,y],[x,y-1],[x,y+1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Shape Preview ────────────────────────────────────────────────────────────
let shapePreviewCanvas = null;
function startShapePreview() { shapePreviewCanvas = createLayerCanvas(); }

function drawShapePreview(x0, y0, x1, y1) {
  if (!shapePreviewCanvas) return;
  const ctx = shapePreviewCanvas.getContext('2d');
  ctx.clearRect(0, 0, canvasW, canvasH);
  ctx.strokeStyle = currentColor; ctx.lineWidth = brushSize; ctx.globalAlpha = brushOpacity;
  ctx.beginPath();
  if (currentTool === 'line') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
  else if (currentTool === 'rect') { ctx.rect(Math.min(x0,x1), Math.min(y0,y1), Math.abs(x1-x0), Math.abs(y1-y0)); }
  else if (currentTool === 'circle') { const rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2; ctx.ellipse(Math.min(x0,x1)+rx, Math.min(y0,y1)+ry, rx, ry, 0, 0, Math.PI*2); }
  ctx.stroke(); ctx.globalAlpha = 1;
  compositeAll(); mainCtx.drawImage(shapePreviewCanvas, 0, 0);
}

function commitShape(x0, y0, x1, y1) {
  const ctx = getActiveCtx();
  ctx.strokeStyle = currentColor; ctx.lineWidth = brushSize; ctx.globalAlpha = brushOpacity;
  ctx.beginPath();
  if (currentTool === 'line') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
  else if (currentTool === 'rect') { ctx.rect(Math.min(x0,x1), Math.min(y0,y1), Math.abs(x1-x0), Math.abs(y1-y0)); }
  else if (currentTool === 'circle') { const rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2; ctx.ellipse(Math.min(x0,x1)+rx, Math.min(y0,y1)+ry, rx, ry, 0, 0, Math.PI*2); }
  ctx.stroke(); ctx.globalAlpha = 1;
  shapePreviewCanvas = null; compositeAll();
}

// ── Mouse Events ─────────────────────────────────────────────────────────────
mainCanvas.addEventListener('mousedown', (e) => {
  if (e.button === 1 || (e.button === 0 && (e.altKey || currentTool === 'move'))) {
    panning = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY;
    mainCanvas.style.cursor = 'grabbing'; return;
  }
  const [x, y] = canvasCoords(e);
  if (currentTool === 'eyedropper') { pickColor(x, y); return; }
  if (currentTool === 'fill') { saveUndo(); floodFill(getActiveCtx(), x, y, currentColor); compositeAll(); return; }
  if (currentTool === 'text') {
    const text = prompt('Text:'); if (!text) return;
    saveUndo(); const ctx = getActiveCtx();
    ctx.fillStyle = currentColor; ctx.font = brushSize + 'px -apple-system, sans-serif';
    ctx.globalAlpha = brushOpacity; ctx.fillText(text, x, y); ctx.globalAlpha = 1;
    compositeAll(); return;
  }
  drawing = true; lastX = x; lastY = y; shapeStartX = x; shapeStartY = y;
  if (['line','rect','circle'].includes(currentTool)) { saveUndo(); startShapePreview(); }
  else { saveUndo(); }
});

mainCanvas.addEventListener('mousemove', (e) => {
  const [x, y] = canvasCoords(e);
  document.getElementById('status-pos').textContent = Math.floor(x) + ', ' + Math.floor(y);
  if (panning) { panX = e.clientX - panStartX; panY = e.clientY - panStartY; updateCanvasTransform(); return; }
  if (!drawing) return;
  if (['line','rect','circle'].includes(currentTool)) { drawShapePreview(shapeStartX, shapeStartY, x, y); }
  else { const ctx = getActiveCtx(); if (currentTool === 'pencil') drawPencilStroke(ctx, lastX, lastY, x, y); else drawBrushStroke(ctx, lastX, lastY, x, y); compositeAll(); }
  lastX = x; lastY = y;
});

mainCanvas.addEventListener('mouseup', (e) => {
  if (panning) { panning = false; mainCanvas.style.cursor = currentTool === 'move' ? 'grab' : 'crosshair'; return; }
  if (!drawing) return; drawing = false;
  const [x, y] = canvasCoords(e);
  if (['line','rect','circle'].includes(currentTool)) { commitShape(shapeStartX, shapeStartY, x, y); }
});

mainCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const worldX = mx / zoom, worldY = my / zoom;
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.05, Math.min(16, zoom * delta));
  panX = e.clientX - canvasArea.getBoundingClientRect().left - worldX * zoom;
  panY = e.clientY - canvasArea.getBoundingClientRect().top - worldY * zoom;
  updateCanvasTransform(); updateZoomDisplay();
}, { passive: false });

// Spacebar pan
let spaceDown = false;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !spaceDown && e.target.tagName !== 'INPUT') {
    e.preventDefault(); spaceDown = true; mainCanvas.style.cursor = 'grab';
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { spaceDown = false; mainCanvas.style.cursor = currentTool === 'move' ? 'grab' : 'crosshair'; }
});
// Override mousedown for space panning
mainCanvas.addEventListener('mousedown', (e) => {
  if (spaceDown && e.button === 0) {
    e.stopImmediatePropagation();
    panning = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY;
    mainCanvas.style.cursor = 'grabbing';
  }
}, true);

function pickColor(x, y) {
  const data = mainCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
  setColor('#' + [data[0],data[1],data[2]].map(v => v.toString(16).padStart(2,'0')).join(''));
}

// ── Transform ────────────────────────────────────────────────────────────────
function updateCanvasTransform() {
  mainCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  mainCanvas.style.transformOrigin = '0 0';
}

function updateZoomDisplay() {
  document.getElementById('zoom-display').textContent = Math.round(zoom * 100) + '%';
}

function centerCanvas() {
  const area = canvasArea.getBoundingClientRect();
  const padding = 80;
  const fitZoom = Math.min((area.width - padding) / canvasW, (area.height - padding) / canvasH, 1);
  zoom = fitZoom;
  panX = (area.width - canvasW * zoom) / 2;
  panY = (area.height - canvasH * zoom) / 2;
  updateCanvasTransform(); updateZoomDisplay();
}

function zoomIn() { zoom = Math.min(16, zoom * 1.2); updateCanvasTransform(); updateZoomDisplay(); }
function zoomOut() { zoom = Math.max(0.05, zoom / 1.2); updateCanvasTransform(); updateZoomDisplay(); }

// ── UI Sync ──────────────────────────────────────────────────────────────────
function syncSliders() {
  const sizeR = document.getElementById('brush-size'), sizeN = document.getElementById('brush-size-num');
  const opR = document.getElementById('brush-opacity'), opN = document.getElementById('brush-opacity-num');
  const hardR = document.getElementById('brush-hardness');
  sizeR.oninput = () => { brushSize = +sizeR.value; sizeN.value = sizeR.value; };
  sizeN.oninput = () => { brushSize = +sizeN.value; sizeR.value = sizeN.value; };
  opR.oninput = () => { brushOpacity = opR.value / 100; opN.value = opR.value; };
  opN.oninput = () => { brushOpacity = opN.value / 100; opR.value = opN.value; };
  hardR.oninput = () => { brushHardness = hardR.value / 100; };
}

function setColor(hex) {
  currentColor = hex;
  document.getElementById('color-picker').value = hex.slice(0,7);
  document.getElementById('color-hex').textContent = hex;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === hex));
}

function renderSwatches() {
  document.getElementById('swatches').innerHTML = SWATCHES.map(c =>
    `<div class="swatch ${c === currentColor ? 'active' : ''}" style="background:${c}${c === '#ffffff' ? ';border:1px solid rgba(0,0,0,0.15)' : ''}" data-color="${c}" onclick="setColor('${c}')"></div>`
  ).join('');
}

document.getElementById('color-picker').addEventListener('input', (e) => setColor(e.target.value));

// Tool buttons
document.querySelectorAll('.ft-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTool = btn.dataset.tool;
    document.querySelectorAll('.ft-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('status-tool').textContent = currentTool;
    mainCanvas.style.cursor = currentTool === 'eyedropper' ? 'crosshair' : currentTool === 'move' ? 'grab' : currentTool === 'text' ? 'text' : 'crosshair';
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const map = {b:'brush',p:'pencil',e:'eraser',l:'line',r:'rect',c:'circle',f:'fill',t:'text',i:'eyedropper',m:'move'};
  if (map[e.key]) { document.querySelector(`[data-tool="${map[e.key]}"]`)?.click(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.metaKey||e.ctrlKey) && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
  if (e.key === '[') { brushSize = Math.max(1, brushSize-1); document.getElementById('brush-size').value = brushSize; document.getElementById('brush-size-num').value = brushSize; }
  if (e.key === ']') { brushSize = Math.min(100, brushSize+1); document.getElementById('brush-size').value = brushSize; document.getElementById('brush-size-num').value = brushSize; }
  if (e.key === '0' && !e.metaKey && !e.ctrlKey) centerCanvas();
  if (e.key === '=' && (e.metaKey||e.ctrlKey)) { e.preventDefault(); zoomIn(); }
  if (e.key === '-' && (e.metaKey||e.ctrlKey)) { e.preventDefault(); zoomOut(); }
});

// ── Actions ──────────────────────────────────────────────────────────────────
function clearCanvas() {
  saveUndo();
  layers.forEach(l => l.canvas.getContext('2d').clearRect(0, 0, canvasW, canvasH));
  // Refill base layer white
  const ctx = layers[0].canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasW, canvasH);
  compositeAll();
}

function fillBackground(color, { skipUndo = false } = {}) {
  if (!skipUndo) saveUndo();
  const ctx = layers[0].canvas.getContext('2d');
  ctx.fillStyle = color || currentColor;
  ctx.fillRect(0, 0, canvasW, canvasH);
  compositeAll();
}

function resizeCanvas() {
  const w = +document.getElementById('canvas-w').value;
  const h = +document.getElementById('canvas-h').value;
  if (w < 1 || h < 1 || w > 8192 || h > 8192) return;
  saveUndo();
  const snapshots = layers.map((layer) => {
    const snapshot = document.createElement('canvas');
    snapshot.width = layer.canvas.width;
    snapshot.height = layer.canvas.height;
    snapshot.getContext('2d').drawImage(layer.canvas, 0, 0);
    return snapshot;
  });
  canvasW = w; canvasH = h;
  mainCanvas.width = w; mainCanvas.height = h;
  layers.forEach((layer, index) => {
    layer.canvas.width = w;
    layer.canvas.height = h;
    layer.canvas.getContext('2d').drawImage(snapshots[index], 0, 0);
  });
  document.getElementById('status-size').textContent = w + ' x ' + h;
  compositeAll(); centerCanvas();
}

function exportCanvas() {
  const a = document.createElement('a');
  a.download = 'hii-visual-' + Date.now() + '.png';
  a.href = mainCanvas.toDataURL('image/png');
  a.click();
}

function saveToHII() {
  fetch('/api/observe', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kind: 'artifact', content: 'Visual canvas saved at ' + new Date().toISOString(), source: 'visual'}),
  }).then(() => {
    document.getElementById('status-tool').textContent = 'Saved to HII';
    setTimeout(() => document.getElementById('status-tool').textContent = currentTool, 2000);
  }).catch(console.error);
}

function aiGenerate() {
  const input = document.getElementById('ai-prompt');
  const prompt = input.value.trim();
  if (!prompt) return;
  // Post as observation for now — intent engine will pick it up
  fetch('/api/observe', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kind: 'ai_request', content: 'Visual AI: ' + prompt, source: 'visual'}),
  }).then(() => {
    input.value = '';
    document.getElementById('status-tool').textContent = 'Request sent to HII';
    setTimeout(() => document.getElementById('status-tool').textContent = currentTool, 2000);
  }).catch(console.error);
}

document.getElementById('ai-prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); aiGenerate(); }
});

// ── Boot ─────────────────────────────────────────────────────────────────────
init();
window.addEventListener('resize', centerCanvas);
</script>
</body>
</html>
