<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to HII</title>
    <link rel="stylesheet" href="companion.css" />
  </head>
  <body class="popup">
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-48.png" alt="" />
          <span><strong>HII Companion</strong><small>Private browser capture</small></span>
        </div>
        <a href="options.html" target="_blank">Setup</a>
      </header>

      <form id="form" class="card">
        <h1>Save this page</h1>
        <p class="lede">Create a durable, source-linked reference in HII.</p>
        <label>Title<input id="title" name="title" required minlength="3" maxlength="120" /></label>
        <label>URL<input id="url" name="url" type="url" required readonly /></label>
        <label>Note<textarea id="note" name="note" maxlength="500" placeholder="Why this matters…"></textarea></label>
        <label>Tags<input id="tags" name="tags" value="browser" placeholder="research, precedent" /></label>
        <label class="choice">
          <input id="share-to-account" type="checkbox" />
          <span>Make available to ChatGPT through my HII account<small>Shares this source link and note with your first writable account workspace. Off by default.</small></span>
        </label>
        <button id="save" type="submit">Save to HII</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <p class="privacy">Only pages you explicitly save are sent to the local HII runtime. Select text and right-click to save an excerpt locally.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
