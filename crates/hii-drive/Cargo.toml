[package]
name = "hii-drive"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "HII Drive: User-owned distributed filesystem/object layer"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dirs = "5.0"
futures = "0.3"
hex = "0.4"
hii-core = { path = "../hii-core" }
rand = "0.8"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"
tempfile = "3.13"
time = "0.3"
thiserror = "1.0"

[lib]
name = "hii_drive"
path = "src/lib.rs"
