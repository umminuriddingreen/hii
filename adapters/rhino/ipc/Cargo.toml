[package]
name = "hii-rhino-ipc"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
description = "Local transport and demultiplexing client for the HII Rhino bridge"

[dependencies]
hii-core = { path = "../../../crates/hii-core" }
hii-rhino-protocol = { path = "../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
