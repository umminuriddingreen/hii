<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point Cloud Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <div class="toolbar-title">POINTCLOUD</div>

    <div class="control-group">
      <label>Points <span id="budget-val">1M</span></label>
      <input type="range" id="point-budget" min="100000" max="10000000" step="100000" value="1000000">
    </div>

    <div class="control-group">
      <label>Size <span id="size-val">2.0</span></label>
      <input type="range" id="point-size" min="0.5" max="8" step="0.5" value="2">
    </div>

    <div class="btn-row">
      <button id="btn-load" title="Load file">&#128194;</button>
      <button id="btn-fit" title="Fit view (F)">&#8862;</button>
    </div>

    <div id="status"></div>
    <input type="file" id="file-input" accept=".las,.laz" hidden>
  </div>

  <div id="fps-counter">0 FPS</div>

  <div id="welcome">
    <div class="welcome-text">Drop point cloud or click &#128194;</div>
    <div class="welcome-sub">.las &middot; .laz</div>
  </div>

  <div id="drop-overlay">
    <div class="drop-text">Drop to load</div>
  </div>

  <div id="loading" class="hidden">
    <div class="loading-text">Loading...</div>
    <div id="loading-progress">0%</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
