[package]
name = "hii-public-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
passkey-rp = "=0.1.0"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
wasm-bindgen = "0.2.107"
worker = { version = "=0.8.3", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"

[workspace]
