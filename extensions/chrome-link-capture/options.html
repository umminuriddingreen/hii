<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to HII Options</title>
    <style>
      body {
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #cfcfcf;
        padding: 9px;
        font: inherit;
      }
      button {
        margin-top: 12px;
        border: 1px solid #111;
        background: #111;
        color: #fff;
        padding: 9px 12px;
        font-weight: 700;
      }
      #status {
        margin-top: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Save to HII</h1>
    <label>
      Local HII ingest endpoint
      <input id="endpoint" />
    </label>
    <label style="display: block; margin-top: 12px;">
      Ingest token (leave blank when your local endpoint does not require one)
      <input id="token" type="password" />
    </label>
    <button id="save">Save options</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
