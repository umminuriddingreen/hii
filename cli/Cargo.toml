[package]
name = "hii"
version = "0.1.0"
edition = "2021"
description = "HII system CLI — fast Rust entry point"

[[bin]]
name = "hii"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
colored = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
