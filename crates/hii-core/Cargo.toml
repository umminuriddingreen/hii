[package]
name = "hii-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Shared local state and contracts for the HII CLI and desktop"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
dirs = "5.0.1"
regex = "1.11.1"
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.22.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = "2.12.1"
url = "2.5.8"
uuid = { version = "1.11.0", features = ["v4"] }
