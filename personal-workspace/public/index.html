<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>UMMI · Private HII</title><link rel="stylesheet" href="/personal/style.css"></head>
<body><main><div class="workspace-header"><button id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button><a class="workspace-return" href="/?view=canvas">HII workspace</a></div>
<div hidden><button id="new">New chat</button><select id="device" aria-label="Device"></select><select id="model" aria-label="Model"></select><select id="image-model" aria-label="ComfyUI image model"></select><button id="refresh">Refresh</button></div>
<nav id="chat-tabs" role="tablist" aria-label="Chats"></nav><section id="messages" aria-live="polite"></section>
<details id="activity" hidden></details><details id="canvas" hidden></details><section id="center" role="dialog" aria-modal="true" aria-label="Personal command center" tabindex="-1" hidden></section><section class="composer"><button id="back-chats" type="button" hidden>Back to chats · Escape</button><div id="attachments" class="attachment-list"></div><div id="commands" role="listbox" aria-label="Commands" hidden></div><div class="editor-tools" hidden><button id="preview-toggle" type="button" aria-pressed="false">Preview</button><button id="add-block" type="button" hidden>+ Block</button><span>⌘Enter / Ctrl Enter send message</span></div><div id="draft-stage" class="prompt-stage" aria-label="Prompt canvas" hidden></div><div id="draft-preview" hidden></div><form id="form"><label class="attach" aria-label="Attach files" title="Attach files">＋<input id="files" type="file" aria-label="Attach files" accept="image/*,.heic,.heif,.pdf,.docx,.pptx,.xlsx,.odt,.txt,.md,.csv,.json,.js,.ts,.py,.rs,.html,.css,.yaml,.yml,.xml,.log,.rtf" multiple></label><textarea id="prompt" placeholder="Message or / command" aria-label="Message" aria-controls="commands" aria-expanded="false" rows="2"></textarea><footer><button id="send" type="submit" aria-label="Send message" title="Send message">↑</button><button id="stop" type="button" hidden>Stop</button></footer></form><span id="connection" role="status" hidden></span><p id="mode-hint" class="keyboard-hint" hidden>Agent loop · /agent helper · /compact memory</p><div class="composer-meta"><button id="command-launch" type="button" aria-label="Open commands">/ Commands</button><span>⌘ / Ctrl ↵ to send</span></div><p id="status" role="status"></p></section>
</main><script type="module" src="/personal/app.js"></script></body></html>
