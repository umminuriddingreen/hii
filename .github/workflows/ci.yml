name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Tracked-file secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run security:secrets

  web:
    name: Svelte check + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test

  cli:
    name: Rust format + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      # `hii-native-runner` is an Apple-Silicon Metal runtime and defaults to the
      # `metal` feature, so its dependency tree reaches objc2 and cannot build on
      # a Linux runner at all. It is covered on macOS by `npm run runner:check`
      # in the packaged-app workflow; formatting above still spans the workspace.
      - run: cargo test --workspace --exclude hii-native-runner
      - run: cargo clippy --workspace --exclude hii-native-runner --all-targets -- -D warnings

  product-proof:
    name: HII product proof gates
    needs: [secrets, web, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PDF page provenance is one of the things this gate proves, and the
      # extractor shells out to pdftotext. Without poppler the scan indexes four
      # of five fixture files and reports the PDF as an unavailable capability —
      # correct behaviour, but not the path the gate is here to cover.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run ci:product

  build:
    name: Production build
    needs: product-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
