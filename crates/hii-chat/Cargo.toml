[package]
name = "hii-chat"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Local conversational inference and persistence shared by HII CLI and desktop"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
eventsource-stream = "0.2"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
