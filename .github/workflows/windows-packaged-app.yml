name: Windows packaged app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-packaged-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer and clean install proof
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run check
      - run: npm run test
      # CI does not hold the minisign updater key, so it builds a bundle that
      # cannot self-update. That is the right trade for a proof run: it proves
      # the installer, the sidecar and the clean install, and the artifact it
      # uploads is explicitly not the one anybody ships.
      - run: node scripts/hii-tauri-build.mjs --no-updater
      - name: Install and smoke-test the packaged app
        shell: pwsh
        run: ./scripts/hii-windows-packaged-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HII-${{ github.sha }}-windows-x64-unsigned-no-updater
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
