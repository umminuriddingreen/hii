[package]
name = "hii-cli"
version = "0.1.0"
edition = "2021"
description = "Fast, local-first workspace agent for HII"
license = "UNLICENSED"

[[bin]]
name = "hii"
path = "src/main.rs"

[features]
default = []
preview = []

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.58", features = ["derive"] }
dirs = "5.0.1"
ignore = "0.4.23"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "2.12.1", features = ["json"] }
uuid = { version = "1.11.0", features = ["v4"] }
