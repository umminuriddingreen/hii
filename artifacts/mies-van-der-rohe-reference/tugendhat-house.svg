<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <rect width="800" height="600" fill="#f5f0e8"/>

    <!-- Sky -->
    <defs>
        <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#c8dce8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8f0f4;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="800" height="200" fill="url(#skyGrad3)"/>

    <!-- Hillside landscape -->
    <path d="M0,200 Q200,180 400,190 T800,170 L800,600 L0,600 Z" fill="#a8bca8" opacity="0.6"/>

    <!-- Main house volume - white cubic form -->
    <rect x="150" y="180" width="500" height="120" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>

    <!-- Flat roof slab with cantilever -->
    <rect x="130" y="170" width="540" height="10" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>

    <!-- Chrome steel columns (thin, elegant) -->
    <g fill="#d8d8d8" stroke="#aaa" stroke-width="0.5">
        <rect x="180" y="300" width="6" height="80"/>
        <rect x="280" y="300" width="6" height="80"/>
        <rect x="380" y="300" width="6" height="80"/>
        <rect x="480" y="300" width="6" height="80"/>
        <rect x="580" y="300" width="6" height="80"/>
    </g>

    <!-- Glass curtain walls -->
    <g opacity="0.2">
        <rect x="186" y="190" width="94" height="110" fill="#e8f4ff" stroke="#ccc" stroke-width="0.5"/>
        <rect x="286" y="190" width="94" height="110" fill="#e8f4ff" stroke="#ccc" stroke-width="0.5"/>
        <rect x="386" y="190" width="94" height="110" fill="#e8f4ff" stroke="#ccc" stroke-width="0.5"/>
        <rect x="486" y="190" width="94" height="110" fill="#e8f4ff" stroke="#ccc" stroke-width="0.5"/>
    </g>

    <!-- Marble and onyx interior walls (visible through glass) -->
    <rect x="300" y="200" width="20" height="100" fill="#d8c8b0" opacity="0.7"/>
    <rect x="350" y="220" width="15" height="80" fill="#e8d8c0" opacity="0.6"/>

    <!-- Terrace/platform -->
    <rect x="120" y="300" width="560" height="15" fill="#d8d4cc" stroke="#bbb" stroke-width="1"/>

    <!-- Garden level below -->
    <path d="M0,350 Q200,330 400,340 T800,320 L800,600 L0,600 Z" fill="#9ab89a" opacity="0.5"/>

    <!-- Swimming pool -->
    <rect x="200" y="380" width="400" height="60" fill="#a8d0e6" opacity="0.7" rx="5"/>
    <g opacity="0.3">
        <line x1="220" y1="400" x2="580" y2="400" stroke="#fff" stroke-width="1"/>
        <line x1="220" y1="420" x2="580" y2="420" stroke="#fff" stroke-width="1"/>
    </g>

    <!-- Landscaping trees -->
    <circle cx="150" cy="350" r="30" fill="#7a9a6d" opacity="0.7"/>
    <circle cx="650" cy="340" r="35" fill="#7a9a6d" opacity="0.7"/>
    <circle cx="700" cy="380" r="25" fill="#6a8a5d" opacity="0.6"/>
    <line x1="150" y1="380" x2="150" y2="420" stroke="#5a3a2a" stroke-width="5"/>
    <line x1="650" y1="375" x2="650" y2="420" stroke="#5a3a2a" stroke-width="5"/>
    <line x1="700" y1="405" x2="700" y2="420" stroke="#5a3a2a" stroke-width="4"/>

    <!-- Entrance steps -->
    <rect x="350" y="315" width="100" height="5" fill="#c8c4bc"/>
    <rect x="360" y="320" width="80" height="5" fill="#b8b4ac"/>
    <rect x="370" y="325" width="60" height="5" fill="#a8a49c"/>

    <!-- Label -->
    <text x="400" y="520" text-anchor="middle" font-family="Helvetica, Arial" font-size="14" fill="#333">Tugendhat House (1930) - Mies van der Rohe</text>
    <text x="400" y="540" text-anchor="middle" font-family="Helvetica, Arial" font-size="11" fill="#666">Marble/onyx/chrome luxury • Free plan • Brno, Czech Republic</text>
    <text x="400" y="560" text-anchor="middle" font-family="Helvetica, Arial" font-size="11" fill="#666">Spatial flow • Glass curtain wall • Platform in landscape</text>
</svg>